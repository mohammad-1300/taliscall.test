name: GitHub Windows RDP + Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 355

    steps:

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections `
            -Value 0

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Start-Service `
            -Name TermService

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication `
            -Value 0

          Write-Host "RDP enabled."

      - name: Create RDP User
        shell: powershell
        run: |
          $password = -join ((33..126) | Get-Random -Count 20 | ForEach-Object {
            [char]$_
          })

          $secure = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "rdpuser" `
            -Password $secure `
            -PasswordNeverExpires `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "rdpuser"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "rdpuser"

          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "RDP user created."

      - name: Install Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "$env:TEMP\tailscale.msi"

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$env:TEMP\tailscale.msi`" /quiet /norestart" `
            -Wait

          Write-Host "Tailscale installed."

      - name: Connect to Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="github-rdp-server" `
            --unattended=true

          Start-Sleep -Seconds 10

          Write-Host "===== TAILSCALE STATUS ====="
          & "$env:ProgramFiles\Tailscale\tailscale.exe" status

      - name: Diagnose RDP
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "        TERMINAL SERVICES"
          Write-Host "========================================"

          Get-Service TermService |
            Format-List Status, StartType, Name, DisplayName

          Write-Host ""
          Write-Host "========================================"
          Write-Host "        RDP REGISTRY"
          Write-Host "========================================"

          Get-ItemProperty `
            'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections

          Write-Host ""
          Write-Host "========================================"
          Write-Host "        3389 LISTENER"
          Write-Host "========================================"

          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue |
            Format-Table LocalAddress, LocalPort, State, OwningProcess

          Write-Host ""
          Write-Host "========================================"
          Write-Host "        NETSTAT"
          Write-Host "========================================"

          netstat -ano | findstr ":3389"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "        LOCAL TCP TEST"
          Write-Host "========================================"

          Test-NetConnection 127.0.0.1 -Port 3389

          Write-Host ""
          Write-Host "========================================"
          Write-Host "        FIREWALL RULES"
          Write-Host "========================================"

          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" |
            Where-Object Enabled -eq "True" |
            Format-Table DisplayName, Profile, Action, Enabled

          Write-Host ""
          Write-Host "========================================"
          Write-Host "        TAILSCALE IP"
          Write-Host "========================================"

          $ip = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4).Trim()

          Write-Host "TAILSCALE_IP=$ip"
          Write-Host "RDP_PORT=3389"
          Write-Host "USERNAME=rdpuser"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "        CONNECTION INFO"
          Write-Host "========================================"

          Write-Host "RDP ADDRESS: $ip`:3389"

      - name: Keep Server Alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "github-rdp-server ACTIVE - $(Get-Date)"
            Start-Sleep -Seconds 60
          }
